<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製造現場用 QR & AI文字起こしスキャナー</title>
    <!-- QRコードリーダー用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #333; }
        
        /* 切替タブ用スタイル */
        .tab-menu {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: #777;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #27ae60;
            border-bottom: 3px solid #27ae60;
            margin-bottom: -2px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* QRリーダーエリア */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        /* 写真撮影ボタン */
        .file-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            border: none;
        }
        .file-btn:active { background-color: #219653; }
        input[type="file"] { display: none; }

        /* プレビュー画像 */
        .preview-area {
            margin-top: 15px;
        }
        #previewImg {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: none;
        }

        /* ステータス表示 */
        #status {
            margin-top: 15px;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .success { color: #28a745; background: #eef9f2; border: 1px solid #d4edda; }
        .error { color: #dc3545; background: #fdf2f2; border: 1px solid #f5c6cb; }
        .info { color: #007bff; background: #eef4f9; border: 1px solid #bee5eb; }
    </style>
</head>
<body>

<div class="container">
    <h2>製造現場用 スキャナー</h2>

    <!-- モード切替タブ -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('qr')">📷 QRコード読取</button>
        <button class="tab-btn" onclick="switchTab('photo')">📝 写真で文字起こし</button>
    </div>

    <!-- Tab 1: QRコードスキャナー -->
    <div id="tab-qr" class="tab-content active">
        <div id="reader"></div>
    </div>

    <!-- Tab 2: 写真AI文字起こし -->
    <div id="tab-photo" class="tab-content">
        <div class="form-group">
            <label for="cameraInput" class="file-btn">📸 写真を撮影して文字起こし</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
        </div>
        <div class="preview-area">
            <img id="previewImg" alt="プレビュー画像">
        </div>
    </div>

    <!-- 共通ステータス -->
    <div id="status" class="info">カメラを準備中...</div>
</div>

<script>
    // GASのウェブアプリURL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw-_EmCBxXqysI_UyfOLZhS-XjEuUFggD1dWrYRMzQhOJ4cwicnGpjt8F1Fxo8K6eBD/exec";
    let isSending = false;
    let html5QrCode = null;

    // タブ切り替え処理
    function switchTab(mode) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (mode === 'qr') {
            event.target.classList.add('active');
            document.getElementById('tab-qr').classList.add('active');
            startQrScanner();
        } else {
            event.target.classList.add('active');
            document.getElementById('tab-photo').classList.add('active');
            stopQrScanner();
        }
    }

    // --- QRコード関連 ---
    function startQrScanner() {
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            videoConstraints: {
                facingMode: "environment",
                advanced: [{ zoom: 2.0 }]
            }
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        ).then(() => {
            setStatus("info", "QRコードをかざしてください");
        }).catch(err => {
            console.error("カメラ起動エラー:", err);
            // zoom非対応時のフォールバック
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);
        });
    }

    function stopQrScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => console.log(err));
        }
    }

    function onScanSuccess(decodedText) {
        if (isSending) return;
        isSending = true;

        setStatus("info", `読み取り成功: ${decodedText} (送信中...)`);

        // POSTでGASへ送信
        sendDataToGAS({ type: "qr", qrText: decodedText }, () => {
            setStatus("success", `送信完了: ${decodedText}`);
            setTimeout(() => {
                isSending = false;
                setStatus("info", "次のQRコードを読み取ってください");
            }, 2000);
        });
    }

    // --- 写真文字起こし関連 ---
    function handleImageSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        setStatus("info", "画像を圧縮・軽量化中...");

        compressImage(file, 1280, 0.8)
            .then(base64Data => {
                const preview = document.getElementById("previewImg");
                preview.src = base64Data;
                preview.style.display = "inline-block";

                // ★サーバーの返事を待たず、投げた瞬間に即座に完了扱いにする（非同期）
                sendDataToGAS({ type: "photo", image: base64Data });
                
                setStatus("success", "送信完了！（裏側でAI文字起こし中）");

                // 数秒後にプレビュー等をリセットして次の撮影に備える
                setTimeout(() => {
                    document.getElementById("cameraInput").value = "";
                    setStatus("info", "次の操作を行ってください");
                }, 2000);
            })
            .catch(err => {
                console.error(err);
                setStatus("error", "エラー: 画像の処理に失敗しました");
            });
    }

    // 画像圧縮関数（Canvas）
    function compressImage(file, maxWidth, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // --- 共通送信関数 ---
    function sendDataToGAS(payload, callback) {
        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            if (callback) callback();
        })
        .catch(error => {
            console.error("送信エラー:", error);
            setStatus("error", "送信に失敗しました。");
            setTimeout(() => { isSending = false; }, 3000);
        });
    }

    function setStatus(className, message) {
        const statusEl = document.getElementById('status');
        statusEl.className = className;
        statusEl.innerText = message;
    }

    // 初期起動時はQRスキャナーをON
    window.onload = function() {
        startQrScanner();
    };
</script>

</body>
</html>
