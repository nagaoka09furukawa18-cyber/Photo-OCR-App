<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製造現場用 QR & AI OCRスキャナー</title>
    <!-- QRコードリーダー用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- トリミング用 (Cropper.js) のスタイルシートとライブラリ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Firebase SDK (Compat版) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 10px;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 1.1rem; margin-bottom: 10px; color: #333; }
        
        /* 切替タブ用スタイル */
        .tab-menu {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            color: #777;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #27ae60;
            border-bottom: 3px solid #27ae60;
            margin-bottom: -2px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ライブプレビュー領域（スマホカメラの縦長比率） */
        .live-video-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 520px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #liveVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* QRリーダーエリア */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover;
            border-radius: 8px;
        }

        /* 写真撮影ボタン */
        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }
        .file-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            border: none;
        }
        .file-btn:active { background-color: #219653; }
        input[type="file"] { display: none; }

        /* プレビュー画像 & 容量表示 */
        .preview-area {
            margin-top: 15px;
        }
        #previewImg {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: none;
        }
        #imageSizeInfo {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            font-weight: bold;
        }

        /* ステータス表示 */
        #status {
            margin-top: 12px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .success { color: #28a745; background: #eef9f2; border: 1px solid #d4edda; }
        .error { color: #dc3545; background: #fdf2f2; border: 1px solid #f5c6cb; }
        .info { color: #007bff; background: #eef4f9; border: 1px solid #bee5eb; }

        /* トリミング・選択モーダル用スタイル */
        #actionModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            box-sizing: border-box;
            padding: 10px;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 480px;
            width: 95%;
            margin: 15px auto;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .modal-content h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: #333;
        }
        
        #previewContainer {
            width: 100%;
            max-height: 70vh;
            overflow: hidden;
            margin-bottom: 10px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #targetImage {
            max-width: 100%;
            max-height: 70vh;
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
            cursor: pointer;
        }
        .btn-send { background: #27ae60; }
        .btn-crop { background: #3498db; }
        .btn-retake { background: #e74c3c; }
        .btn-back { background: #95a5a6; }

        /* Cropper.js ハンドル拡大カスタム */
        .cropper-point {
            width: 22px !important;
            height: 22px !important;
            background-color: #3498db !important;
            opacity: 0.9 !important;
            border-radius: 50% !important;
            margin: -6px 0 0 -6px; 
        }
        .cropper-point.point-se { width: 26px !important; height: 26px !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>製造現場用 スキャナー</h2>

    <!-- モード切替タブ -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('live', event)">👁️ ライブ</button>
        <button class="tab-btn" onclick="switchTab('qr', event)">📷 QR読取</button>
        <button class="tab-btn" onclick="switchTab('photo', event)">📝 写真OCR</button>
    </div>

    <!-- ライブカメラ -->
    <div id="tab-live" class="tab-content active">
        <div class="live-video-container">
            <video id="liveVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- QRコードスキャナー -->
    <div id="tab-qr" class="tab-content">
        <div id="reader"></div>
    </div>

    <!-- 写真AI OCR -->
    <div id="tab-photo" class="tab-content">
        <div class="form-group">
            <label for="cameraInput" class="file-btn">📸 写真を撮影してOCR</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
        </div>
        <div class="preview-area">
            <img id="previewImg" alt="プレビュー画像">
            <div id="imageSizeInfo"></div>
        </div>
    </div>

    <!-- 共通ステータス -->
    <div id="status" class="info">システム初期化中...</div>
</div>

<!-- 撮影後プレビュー・トリミング選択モーダル -->
<div id="actionModal">
    <div class="modal-content">
        <h3 id="modalTitle">撮影画像の処理方法を選択してください</h3>
        
        <div id="previewContainer">
            <img id="targetImage" alt="撮影画像">
        </div>
        <div id="modalSizeInfo" style="font-size: 0.85rem; color: #666; margin-bottom: 8px; font-weight: bold;"></div>

        <div id="choiceButtons" class="modal-buttons">
            <button class="btn-send" onclick="sendAsIs()">そのまま送信</button>
            <button class="btn-crop" onclick="startCropMode()">トリミング</button>
            <button class="btn-retake" onclick="retakePhoto()">再撮影</button>
        </div>

        <div id="cropConfirmButtons" class="modal-buttons" style="display: none;">
            <button class="btn-send" onclick="confirmCropAndSend()">この範囲で送信</button>
            <button class="btn-back" onclick="cancelCrop()">戻る</button>
        </div>
    </div>
</div>

<script>
    // --- Firebase 初期設定 ---
    const firebaseConfig = {
        apiKey: "AIzaSyCn3nBXukyJ7HqZQudIruiG8JRejUb8x7A",
        authDomain: "imageocr-b1f78.firebaseapp.com",
        projectId: "imageocr-b1f78",
        storageBucket: "imageocr-b1f78.firebasestorage.app",
        messagingSenderId: "524688602430",
        appId: "1:524688602430:web:5e993414e427dc1e59e86f",
        measurementId: "G-C2KR51YJHY"
    };

    // 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    let isSending = false;
    let html5QrCode = null;
    let liveStream = null;
    let rawImageBase64 = "";
    let cropperInstance = null;

    // タブ切り替え処理
    function switchTab(mode, evt) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        stopLiveCamera();
        stopQrScanner();

        if (mode === 'live') {
            evt.currentTarget.classList.add('active');
            document.getElementById('tab-live').classList.add('active');
            startLiveCamera();
            setStatus("info", "ライブプレビュー中");
        } else if (mode === 'qr') {
            evt.currentTarget.classList.add('active');
            document.getElementById('tab-qr').classList.add('active');
            startQrScanner();
        } else if (mode === 'photo') {
            evt.currentTarget.classList.add('active');
            document.getElementById('tab-photo').classList.add('active');
            setStatus("info", "写真を撮影してOCRを行ってください");
        }
    }

    // カメラ起動
    function startLiveCamera() {
        const videoElement = document.getElementById('liveVideo');
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 1920 }
            } 
        })
        .then(stream => {
            liveStream = stream;
            videoElement.srcObject = stream;
        })
        .catch(err => {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    liveStream = stream;
                    videoElement.srcObject = stream;
                })
                .catch(e => {
                    setStatus("error", "カメラの起動に失敗しました");
                });
        });
    }

    function stopLiveCamera() {
        if (liveStream) {
            liveStream.getTracks().forEach(track => track.stop());
            liveStream = null;
        }
    }

    // QRスキャナー
    function startQrScanner() {
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        if (html5QrCode.isScanning) return;

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess
        ).then(() => {
            setStatus("info", "QRコードをかざしてください");
        }).catch(err => {
            setStatus("error", "QRカメラの起動に失敗しました");
        });
    }

    function stopQrScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => console.log(err));
        }
    }

    // QR読み取り成功時：Firestoreにデータを送信
    function onScanSuccess(decodedText) {
        if (isSending) return;
        isSending = true;

        setStatus("info", `読み取り成功: ${decodedText} (Firestore送信中...)`);

        db.collection("scans").add({
            type: "qr",
            content: decodedText,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            setStatus("success", `保存完了: ${decodedText}`);
            setTimeout(() => {
                isSending = false;
                setStatus("info", "次のQRコードを読み取ってください");
            }, 2000);
        })
        .catch((error) => {
            console.error("Firestore保存エラー: ", error);
            setStatus("error", "データの保存に失敗しました");
            isSending = false;
        });
    }

    // 写真撮影・圧縮
    document.getElementById('cameraInput').addEventListener('change', function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        const file = files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            compressImageToTargetSize(event.target.result, 1200, 500 * 1024, function(compressedBase64, sizeKB) {
                rawImageBase64 = compressedBase64;

                const imgEl = document.getElementById('targetImage');
                imgEl.src = rawImageBase64;
                
                // 容量をリアルタイム表示
                document.getElementById('modalSizeInfo').textContent = `送信画像容量: ${sizeKB}`;
                document.getElementById('imageSizeInfo').textContent = `選択画像容量: ${sizeKB}`;

                document.getElementById('actionModal').style.display = 'block';
                document.getElementById('choiceButtons').style.display = 'flex';
                document.getElementById('cropConfirmButtons').style.display = 'none';
            });
        };

        reader.readAsDataURL(file);
    });

    function compressImageToTargetSize(base64Str, maxWidth, maxBytes, callback) {
        const img = new Image();
        img.src = base64Str;
        img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.90;
            let compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            let sizeBytes = Math.round((compressedBase64.split(',')[1].length) * 0.75);

            while (sizeBytes > maxBytes && quality > 0.2) {
                quality -= 0.1;
                compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                sizeBytes = Math.round((compressedBase64.split(',')[1].length) * 0.75);
            }

            // バイト / KB の見やすい容量表記を作成
            let sizeDisplay = '';
            if (sizeBytes < 1024 * 1024) {
                sizeDisplay = (sizeBytes / 1024).toFixed(1) + ' KB (' + sizeBytes.toLocaleString() + ' bytes)';
            } else {
                sizeDisplay = (sizeBytes / (1024 * 1024)).toFixed(2) + ' MB (' + sizeBytes.toLocaleString() + ' bytes)';
            }

            callback(compressedBase64, sizeDisplay);
        };
    }

    function sendAsIs() {
        closeModal();
        uploadImageToStorageAndProcess(rawImageBase64);
    }

    function startCropMode() {
        document.getElementById('choiceButtons').style.display = 'none';
        document.getElementById('cropConfirmButtons').style.display = 'flex';
        document.getElementById('modalSizeInfo').textContent = "四隅や枠を動かして必要な部分を囲んでください";

        const imgEl = document.getElementById('targetImage');
        if (cropperInstance) {
            cropperInstance.destroy();
        }

        cropperInstance = new Cropper(imgEl, {
            aspectRatio: NaN,
            viewMode: 1,
            dragMode: 'crop',
            autoCropArea: 0.9,
            responsive: true,
            restore: true,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false,
            crop: function() {
                // トリミング範囲変更中にもリアルタイムで容量計算して表示
                const canvas = cropperInstance.getCroppedCanvas({
                    maxWidth: 1200,
                    maxHeight: 1200,
                });
                if (canvas) {
                    const tempBase64 = canvas.toDataURL('image/jpeg', 0.9);
                    const tempBytes = Math.round((tempBase64.split(',')[1].length) * 0.75);
                    const tempKB = (tempBytes / 1024).toFixed(1) + ' KB (' + tempBytes.toLocaleString() + ' bytes)';
                    document.getElementById('modalSizeInfo').textContent = `トリミング後容量: ${tempKB}`;
                }
            }
        });
    }

    function confirmCropAndSend() {
        if (!cropperInstance) return;

        const canvas = cropperInstance.getCroppedCanvas({
            maxWidth: 1200,
            maxHeight: 1200,
        });
        
        let quality = 0.90;
        let croppedBase64 = canvas.toDataURL('image/jpeg', quality);
        let sizeBytes = Math.round((croppedBase64.split(',')[1].length) * 0.75);

        while (sizeBytes > (500 * 1024) && quality > 0.2) {
            quality -= 0.1;
            croppedBase64 = canvas.toDataURL('image/jpeg', quality);
            sizeBytes = Math.round((croppedBase64.split(',')[1].length) * 0.75);
        }

        closeModal();
        uploadImageToStorageAndProcess(croppedBase64);
    }

    function cancelCrop() {
        if (cropperInstance) {
            cropperInstance.destroy();
            cropperInstance = null;
        }
        const imgEl = document.getElementById('targetImage');
        imgEl.src = rawImageBase64;
        
        const base64Body = rawImageBase64.split(',')[1];
        const bytes = Math.round(base64Body.length * 0.75);
        const sizeStr = (bytes / 1024).toFixed(1) + ' KB (' + bytes.toLocaleString() + ' bytes)';
        document.getElementById('modalSizeInfo').textContent = `送信画像容量: ${sizeStr}`;

        document.getElementById('choiceButtons').style.display = 'flex';
        document.getElementById('cropConfirmButtons').style.display = 'none';
    }

    function retakePhoto() {
        closeModal();
        document.getElementById('cameraInput').value = '';
        document.getElementById('cameraInput').click();
    }

    function closeModal() {
        document.getElementById('actionModal').style.display = 'none';
        if (cropperInstance) {
            cropperInstance.destroy();
            cropperInstance = null;
        }
        document.getElementById('cameraInput').value = '';
    }

    // 写真データ：Base64のFirestore保存 ＆ Firebase Storage一時アップロード処理
    function uploadImageToStorageAndProcess(base64Data) {
        setStatus("info", "画像をBase64形式でFirestoreへ保存中...");

        const preview = document.getElementById("previewImg");
        preview.src = base64Data;
        preview.style.display = "inline-block";

        // 1. FirestoreへBase64文字列として直接保存
        db.collection("scans").add({
            type: "photo_ocr",
            imageBase64: base64Data,  // Base64テキストデータ保存
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            setStatus("info", "Firestore保存完了。Storageへ一時アップロード中...");

            // 2. 既存のFirebase Storage一時保存処理
            const fileName = `ocr_temp_${Date.now()}.jpg`;
            const storageRef = storage.ref().child(`temp_images/${fileName}`);

            storageRef.putString(base64Data, 'data_url').then((snapshot) => {
                setStatus("info", "一時保存完了。OCR処理へ連携中...");
                
                storageRef.delete().then(() => {
                    console.log("一時画像をStorageから正常に削除しました");
                }).catch((err) => {
                    console.warn("一時画像の削除に失敗しました:", err);
                });

                setStatus("success", "Base64保存 ＆ OCR処理が完了しました！");
            }).catch((error) => {
                console.error("Storageアップロードエラー: ", error);
                setStatus("error", "Storageへの送信に失敗しました");
            });

        })
        .catch((error) => {
            console.error("Firestore保存エラー: ", error);
            setStatus("error", "FirestoreへのBase64データ保存に失敗しました");
        });
    }
    
    function setStatus(className, message) {
        const statusEl = document.getElementById('status');
        statusEl.className = className;
        statusEl.innerText = message;
    }

    window.onload = function() {
        startLiveCamera();
        setStatus("info", "ライブプレビュー中");
    };
</script>

</body>
</html>
