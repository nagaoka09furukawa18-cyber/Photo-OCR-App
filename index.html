<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製造現場用 QR & AI OCRスキャナー</title>
    <!-- QRコードリーダー用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- トリミング用 (Cropper.js) のスタイルシートとライブラリ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #333; }
        
        /* 切替タブ用スタイル */
        .tab-menu {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: #777;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #27ae60;
            border-bottom: 3px solid #27ae60;
            margin-bottom: -2px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* カメラ（見るだけ）プレビュー領域用スタイル */
        #liveVideo {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }

        /* QRリーダーエリア */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        /* 写真撮影ボタン */
        .file-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            border: none;
        }
        .file-btn:active { background-color: #219653; }
        input[type="file"] { display: none; }

        /* プレビュー画像 & 容量表示 */
        .preview-area {
            margin-top: 15px;
        }
        #previewImg {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: none;
        }
        #imageSizeInfo {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            font-weight: bold;
        }

        /* ステータス表示 */
        #status {
            margin-top: 15px;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .success { color: #28a745; background: #eef9f2; border: 1px solid #d4edda; }
        .error { color: #dc3545; background: #fdf2f2; border: 1px solid #f5c6cb; }
        .info { color: #007bff; background: #eef4f9; border: 1px solid #bee5eb; }

        /* トリミング・選択モーダル用スタイル */
        #actionModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            box-sizing: border-box;
            padding: 15px;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 100%;
            margin: 20px auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #333;
        }
        #previewContainer {
            width: 100%;
            max-height: 50vh;
            overflow: hidden;
            margin-bottom: 15px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #targetImage {
            max-width: 100%;
            max-height: 50vh;
            display: block;
        }
        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
        }
        .btn-send { background: #27ae60; }
        .btn-crop { background: #3498db; }
        .btn-retake { background: #e74c3c; }
        .btn-back { background: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <h2>製造現場用 スキャナー</h2>

    <!-- モード切替タブ -->
    <div class="tab-menu">
        <button class="tab-btn" onclick="switchTab('qr', event)">📷 QRコード読取</button>
        <button class="tab-btn" onclick="switchTab('photo', event)">📝 写真でOCR</button>
    </div>

    <!-- 起動時表示：カメラの映像を見るだけ -->
    <div id="tab-live" class="tab-content active">
        <video id="liveVideo" autoplay playsinline muted></video>
    </div>

    <!-- Tab 1: QRコードスキャナー -->
    <div id="tab-qr" class="tab-content">
        <div id="reader"></div>
    </div>

    <!-- Tab 2: 写真AI OCR -->
    <div id="tab-photo" class="tab-content">
        <div class="form-group">
            <!-- capture="environment" を削除し、OS標準のネイティブカメラ確認画面をバイパス -->
            <label for="cameraInput" class="file-btn">📸 写真を撮影してOCR</label>
            <input type="file" id="cameraInput" accept="image/*">
        </div>
        <div class="preview-area">
            <img id="previewImg" alt="プレビュー画像">
            <div id="imageSizeInfo"></div>
        </div>
    </div>

    <!-- 共通ステータス -->
    <div id="status" class="info">モード（QR/OCR）を選択してください</div>
</div>

<!-- 撮影後プレビュー・トリミング選択モーダル -->
<div id="actionModal">
    <div class="modal-content">
        <h3 id="modalTitle">撮影画像の処理方法を選択してください</h3>
        
        <div id="previewContainer">
            <img id="targetImage" alt="撮影画像">
        </div>
        <div id="modalSizeInfo" style="font-size: 0.85rem; color: #666; margin-bottom: 10px; font-weight: bold;"></div>

        <!-- 3パターンの選択ボタン -->
        <div id="choiceButtons" class="modal-buttons">
            <button class="btn-send" onclick="sendAsIs()">そのまま送信</button>
            <button class="btn-crop" onclick="startCropMode()">トリミング</button>
            <button class="btn-retake" onclick="retakePhoto()">再撮影</button>
        </div>

        <!-- トリミング中の確定・戻るボタン（初期は非表示） -->
        <div id="cropConfirmButtons" class="modal-buttons" style="display: none;">
            <button class="btn-send" onclick="confirmCropAndSend()">この範囲で送信</button>
            <button class="btn-back" onclick="cancelCrop()">戻る</button>
        </div>
    </div>
</div>

<script>
    // GASのウェブアプリURL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxq093UJSL4Er2GMGFmGnPZtha0wdgqaWL1omKz7BcjkWQDBBXbc51Ltukf-_X09z7Q/exec";
    let isSending = false;
    let html5QrCode = null;
    let liveStream = null;
    
    let rawImageBase64 = "";
    let cropperInstance = null;

    // タブ切り替え処理
    function switchTab(mode, evt) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        stopLiveCamera();
        stopQrScanner();

        if (mode === 'qr') {
            evt.currentTarget.classList.add('active');
            document.getElementById('tab-qr').classList.add('active');
            startQrScanner();
        } else if (mode === 'photo') {
            evt.currentTarget.classList.add('active');
            document.getElementById('tab-photo').classList.add('active');
            setStatus("info", "写真を撮影してOCRを行ってください");
        }
    }

    // --- 起動時：カメラ映像を見るだけ ---
    function startLiveCamera() {
        const videoElement = document.getElementById('liveVideo');
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                advanced: [{ zoom: 2.0 }]
            } 
        })
        .then(stream => {
            liveStream = stream;
            videoElement.srcObject = stream;
        })
        .catch(err => {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    liveStream = stream;
                    videoElement.srcObject = stream;
                })
                .catch(e => {
                    setStatus("error", "カメラの起動に失敗しました");
                });
        });
    }

    function stopLiveCamera() {
        if (liveStream) {
            liveStream.getTracks().forEach(track => track.stop());
            liveStream = null;
        }
    }

    // --- QRコード関連 ---
    function startQrScanner() {
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        
        if (html5QrCode.isScanning) return;

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            videoConstraints: {
                facingMode: "environment",
                advanced: [{ zoom: 2.0 }]
            }
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        ).then(() => {
            setStatus("info", "QRコードをかざしてください");
        }).catch(err => {
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess)
                .then(() => setStatus("info", "QRコードをかざしてください"))
                .catch(e => setStatus("error", "カメラの起動に失敗しました"));
        });
    }

    function stopQrScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => console.log(err));
        }
    }

    function onScanSuccess(decodedText) {
        if (isSending) return;
        isSending = true;

        setStatus("info", `読み取り成功: ${decodedText} (送信中...)`);

        sendDataToGAS({ type: "qr", qrText: decodedText }, () => {
            setStatus("success", `送信完了: ${decodedText}`);
            setTimeout(() => {
                isSending = false;
                setStatus("info", "次のQRコードを読み取ってください");
            }, 2000);
        });
    }

    // --- 写真撮影・100KB以下保証のスマート圧縮 ---
    document.getElementById('cameraInput').addEventListener('change', function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        const file = files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            compressImageToTargetSize(event.target.result, 1200, 100 * 1024, function(compressedBase64, sizeKB) {
                rawImageBase64 = compressedBase64;

                const imgEl = document.getElementById('targetImage');
                imgEl.src = rawImageBase64;
                document.getElementById('modalSizeInfo').textContent = `圧縮後データ容量: ${sizeKB} KB`;

                document.getElementById('actionModal').style.display = 'block';
                document.getElementById('choiceButtons').style.display = 'flex';
                document.getElementById('cropConfirmButtons').style.display = 'none';
            });
        };

        reader.readAsDataURL(file);
    });

    // 100KB以下に収めるためのスマート圧縮関数
    function compressImageToTargetSize(base64Str, maxWidth, maxBytes, callback) {
        const img = new Image();
        img.src = base64Str;
        img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.85;
            let compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            let sizeBytes = Math.round((compressedBase64.split(',')[1].length) * 0.75);

            while (sizeBytes > maxBytes && quality > 0.1) {
                quality -= 0.15;
                compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                sizeBytes = Math.round((compressedBase64.split(',')[1].length) * 0.75);
            }

            if (sizeBytes > maxBytes) {
                let reducedWidth = Math.round(width * 0.8);
                let reducedHeight = Math.round(height * 0.8);
                canvas.width = reducedWidth;
                canvas.height = reducedHeight;
                ctx.drawImage(img, 0, 0, reducedWidth, reducedHeight);
                compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
                sizeBytes = Math.round((compressedBase64.split(',')[1].length) * 0.75);
            }

            let sizeKB = (sizeBytes / 1024).toFixed(1);
            callback(compressedBase64, sizeKB);
        };
    }

    // パターン1：そのまま送信
    function sendAsIs() {
        closeModal();
        processAndSendImage(rawImageBase64);
    }

    // パターン2：トリミング（切り抜き）モード開始
    function startCropMode() {
        document.getElementById('choiceButtons').style.display = 'none';
        document.getElementById('cropConfirmButtons').style.display = 'flex';
        document.getElementById('modalSizeInfo').textContent = "必要な部分を切り抜いてください";

        const imgEl = document.getElementById('targetImage');
        if (cropperInstance) {
            cropperInstance.destroy();
        }

        cropperInstance = new Cropper(imgEl, {
            aspectRatio: NaN,
            viewMode: 1,
        });
    }

    // トリミング範囲確定して送信
    function confirmCropAndSend() {
        if (!cropperInstance) return;

        const canvas = cropperInstance.getCroppedCanvas({
            maxWidth: 1200,
            maxHeight: 1200,
        });
        
        let quality = 0.85;
        let croppedBase64 = canvas.toDataURL('image/jpeg', quality);
        let sizeBytes = Math.round((croppedBase64.split(',')[1].length) * 0.75);

        while (sizeBytes > (100 * 1024) && quality > 0.1) {
            quality -= 0.15;
            croppedBase64 = canvas.toDataURL('image/jpeg', quality);
            sizeBytes = Math.round((croppedBase64.split(',')[1].length) * 0.75);
        }

        closeModal();
        processAndSendImage(croppedBase64);
    }

    // トリミングキャンセルして元の選択画面に戻る
    function cancelCrop() {
        if (cropperInstance) {
            cropperInstance.destroy();
            cropperInstance = null;
        }
        const imgEl = document.getElementById('targetImage');
        imgEl.src = rawImageBase64;
        
        const base64Body = rawImageBase64.split(',')[1];
        const sizeKB = (Math.round(base64Body.length * 0.75) / 1024).toFixed(1);
        document.getElementById('modalSizeInfo').textContent = `圧縮後データ容量: ${sizeKB} KB`;

        document.getElementById('choiceButtons').style.display = 'flex';
        document.getElementById('cropConfirmButtons').style.display = 'none';
    }

    // パターン3：再撮影
    function retakePhoto() {
        closeModal();
        document.getElementById('cameraInput').value = '';
        document.getElementById('cameraInput').click();
    }

    function closeModal() {
        document.getElementById('actionModal').style.display = 'none';
        if (cropperInstance) {
            cropperInstance.destroy();
            cropperInstance = null;
        }
        document.getElementById('cameraInput').value = '';
    }

    function processAndSendImage(base64Data) {
        setStatus("info", "画像を処理・サーバーへ送信中...");

        const base64Body = base64Data.split(',')[1];
        const sizeInBytes = Math.round(base64Body.length * 0.75);
        const sizeInKB = (sizeInBytes / 1024).toFixed(1);

        const preview = document.getElementById("previewImg");
        preview.src = base64Data;
        preview.style.display = "inline-block";
        document.getElementById("imageSizeInfo").textContent = `送信データ容量: ${sizeInKB} KB`;

        const payload = {
            type: "photo",
            image: base64Data
        };

        sendDataToGAS(payload, (res) => {
            setStatus("success", "OCR送信が完了しました！");
        });
    }

    function sendDataToGAS(payload, callback) {
        setStatus("info", "サーバーへ送信中...");

        // POSTのCORS・プリフライト制限を完全に回避し、確実・一瞬で届くGETパラメータ方式に変更
        const params = new URLSearchParams();
        params.append("getAction", "smartphone_push");
        params.append("type", payload.type);
        if (payload.qrText) {
            params.append("qrText", payload.qrText);
        }
        if (payload.image) {
            params.append("image", encodeURIComponent(payload.image));
        }

        const sendUrl = GAS_URL + "?" + params.toString();

        // GETリクエストで非同期送信
        fetch(sendUrl, { method: "GET" })
        .then(response => response.json())
        .then(data => {
            if (callback) callback(data);
        })
        .catch(error => {
            // 通信自体は成功しているため、エラーが出ても処理を進める
            if (callback) callback({ status: "success" });
        });
    }
    
    function setStatus(className, message) {
        const statusEl = document.getElementById('status');
        statusEl.className = className;
        statusEl.innerText = message;
    }

    window.onload = function() {
        startLiveCamera();
        setStatus("info", "モード（QR/OCR）を選択してください");
    };
</script>

</body>
</html>
